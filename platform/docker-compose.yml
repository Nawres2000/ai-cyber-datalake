# Déploiement complet de la plateforme en une commande :
#   docker compose up -d --build                       -> MongoDB, API, site, Kafka, Kafka UI, scoring
#   docker compose --profile import run --rm importer  -> charge les résultats du notebook 06
#   docker compose --profile replay up producer        -> rejoue la période de test dans Kafka (temps réel)
# Prérequis : fichier platform/.env avec JWT_SECRET=... ; dossiers ../data, ../models, ../reports remplis (DVC).
# Les ports 3000, 5000, 8080, 9092 doivent être libres (arrêter les « npm run dev » locaux).

services:
  mongo:
    image: mongo:7
    container_name: soc-mongo
    ports:
      - "27018:27017"            # 27018 côté Windows pour ne pas gêner un MongoDB local sur 27017
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: soc-backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ai_cyber_datalake
      JWT_SECRET: ${JWT_SECRET:?Créer platform/.env avec JWT_SECRET=une-longue-chaine-aleatoire}
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: soc-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  kafka:
    image: apache/kafka:3.9.0
    container_name: soc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: soc-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: suricata
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  scorer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: soc-scorer
    command: ["python", "scorer.py", "--models", "/models", "--bootstrap", "kafka:29092",
              "--mongo", "mongodb://mongo:27017/ai_cyber_datalake"]
    volumes:
      - ../models:/models:ro
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

  producer:
    profiles: ["replay"]
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: soc-producer
    command: ["python", "producer.py", "--source", "gold", "--gold", "/data/gold_ml_entrant.parquet",
              "--models", "/models", "--rate", "20", "--bootstrap", "kafka:29092"]
    volumes:
      - ../data:/data:ro
      - ../models:/models:ro
    depends_on:
      kafka:
        condition: service_healthy

  importer:
    profiles: ["import"]
    build:
      context: .
      dockerfile: Dockerfile.python
    working_dir: /app/ml
    command: ["python", "import_results.py", "--pred", "/data/predictions_test.parquet",
              "--models", "/reports/model_results_final.json", "--mongo", "mongodb://mongo:27017/ai_cyber_datalake"]
    volumes:
      - ../data:/data:ro
      - ../reports:/reports:ro
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
